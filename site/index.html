<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prova FIAP CC — Fases 1 a 6</title>
<meta name="description" content="Resumos, links e banco de questões colaborativo para a prova de Ciência da Computação da FIAP (fases 1 a 6).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* Layout: painel de missão — cabeçalho fixo com abas, coluna de leitura de ~72ch, cartões só onde há interação */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#151821; --muted:#5d6475; --line:#dde0e8;
  --accent:#2c50d6; --accent-soft:#e6ebfc; --hot:#c2410c; --hot-soft:#fdeee5;
  --ok:#137a43; --ok-soft:#e3f4ea; --bad:#b4232c; --bad-soft:#fbe6e7; --code:#eef0f5;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1117; --surface:#171a23; --fg:#e8eaf0; --muted:#9aa1b2; --line:#2a2f3c;
  --accent:#8aa2ff; --accent-soft:#1f2747; --hot:#fb923c; --hot-soft:#3a2216;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1719; --code:#1e222d; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);margin:0}
a{color:var(--accent)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(22px,4vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stats{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--fg)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{font:600 14px var(--f-body);background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font:800 22px/1.2 var(--f-display);margin:28px 0 10px;text-wrap:balance}
h3{font:600 18px/1.3 var(--f-display);margin:0;text-wrap:balance}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:68ch}
code,pre{font-family:var(--f-mono);font-size:13px;background:var(--code);border-radius:4px}
code{padding:1px 5px}
pre{padding:12px 14px;overflow-x:auto;line-height:1.5;margin:8px 0 12px}
pre code{padding:0;background:none}
table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;display:block;overflow-x:auto;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
ul{padding-left:20px;margin:0 0 10px}
blockquote{margin:10px 0;background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:14px}
blockquote p:last-child{margin:0}
.pill{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--code);color:var(--muted)}
.pill.p3{background:var(--hot-soft);color:var(--hot)}
.pill.p2{background:var(--accent-soft);color:var(--accent)}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
select{font:500 14px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.intel{border-left:3px solid var(--hot);padding:4px 0 4px 14px;margin:14px 0}
.intel p{margin:0 0 4px}
.plan{border-top:1px solid var(--line)}
.plan-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.plan-item input{width:18px;height:18px;accent-color:var(--accent)}
.meta{font:12px var(--f-mono);color:var(--muted)}
.plan-item.done h3{text-decoration:line-through;color:var(--muted)}
.group-label{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 4px}
details.topic{border-top:1px solid var(--line);padding:16px 0}
details.topic>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary h3::after{content:" +";color:var(--muted);font-weight:400}
details.topic[open]>summary h3::after{content:" −"}
.topic-body{max-width:72ch;margin-top:10px}
.linkbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0 4px}
.linkbox>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.linkbox h4{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.linkbox ul{margin:0;padding-left:18px;font-size:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:12px var(--f-mono);color:var(--muted);margin-bottom:10px}
.qtext{font-size:16px;font-weight:500;margin-bottom:12px;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;font:15px/1.45 var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0;white-space:pre-wrap}
.opt .k{font:600 13px var(--f-mono);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.exp{margin-top:12px;padding:12px;border-radius:8px;background:var(--code);font-size:14px}
.exp b.ok{color:var(--ok)} .exp b.bad{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent)}
.result{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;margin-top:14px}
.revlist{display:grid;gap:10px;margin-top:14px}
.revitem{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.revitem.bad{border-left:4px solid var(--bad)} .revitem.ok{border-left:4px solid var(--ok)}
.small{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px}
@media (max-width:520px){.qcard{padding:14px}.plan-item{grid-template-columns:auto 1fr}.plan-item .row{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <h1>Prova FIAP CC<small>Ciência da Computação · Fases 1 a 6</small></h1>
    <div class="stats" id="stats"></div>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="roteiro">Roteiro</button>
    <button role="tab" data-tab="materias">Matérias</button>
    <button role="tab" data-tab="treino">Treinar</button>
    <button role="tab" data-tab="simulado">Simulado</button>
    <button role="tab" data-tab="erros">Erros</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="roteiro" role="tabpanel"></section>
  <section id="materias" role="tabpanel" hidden></section>
  <section id="treino" role="tabpanel" hidden></section>
  <section id="simulado" role="tabpanel" hidden></section>
  <section id="erros" role="tabpanel" hidden></section>
  <footer class="small" id="rodape"></footer>
</main>

<script src="dados.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!window.DADOS){document.querySelector("main").innerHTML='<div class="empty">Não encontrei <code>site/dados.js</code>. Rode <code>python3 scripts/build.py</code> na raiz do repositório e recarregue a página.</div>';return}
const store={get(k,d){try{const v=localStorage.getItem("provafiap:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("provafiap:"+k,JSON.stringify(v))}catch(e){}}};
const md=s=>window.marked?marked.parse(s):"<pre>"+esc(s)+"</pre>";
const {materias:MAT,questoes:Q,repo:REPO}=window.DADOS;
const MBY=Object.fromEntries(MAT.map(m=>[m.id,m]));
const QBY=Object.fromEntries(Q.map(q=>[q.id,q]));
const PRIO={3:"alta",2:"média",1:"baixa"};
const temOficiais=Q.some(q=>q.fonte==="oficial");
const FONTES={comunidade:"Comunidade",oficial:"Oficial FIAP (local)"};
const repoLink=(p,txt)=>REPO?`<a href="${esc(REPO)}${p}" target="_blank" rel="noopener">${txt}</a>`:txt;

let hist=store.get("hist",{});
function record(q,ok){const h=hist[q.id]||{n:0,ok:0};h.n++;if(ok)h.ok++;h.last=ok;hist[q.id]=h;store.set("hist",hist);renderStats()}
function renderStats(){
  const ids=Object.keys(hist).filter(id=>QBY[id]);
  const tot=ids.reduce((s,id)=>s+hist[id].n,0),ok=ids.reduce((s,id)=>s+hist[id].ok,0);
  const pend=ids.filter(id=>hist[id].last===false).length;
  $("#stats").innerHTML=`<span><b>${Q.length}</b> questões</span><span><b>${ids.length}</b> vistas</span><span><b>${tot?Math.round(ok/tot*100):0}%</b> acerto</span><span><b>${pend}</b> a revisar</span>`;
}

const tabs=[...document.querySelectorAll("#tabs button")];
function show(t){tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!==t);store.set("tab",t);if(t==="erros")renderErros()}
tabs.forEach(b=>b.onclick=()=>{show(b.dataset.tab);window.scrollTo(0,0)});
const cnt=id=>Q.filter(q=>q.materia===id).length;
function abrirMateria(id){show("materias");const el=document.getElementById("m-"+id);if(el){el.open=true;el.scrollIntoView()}}
function treinarMateria(id){Object.assign(trainState,{materia:id,fonte:"",fase:""});startTrain();show("treino");window.scrollTo(0,0)}

// ---- roteiro
function renderRoteiro(){
  const done=store.get("done",{});
  const order=MAT.slice().sort((a,b)=>b.prioridade-a.prioridade||a.ordem-b.ordem);
  $("#roteiro").innerHTML=`
  <h2>O que cai, pelo relato de quem já fez</h2>
  <div class="intel">
    <p><b>Estrutura de dados (2 questões):</b> heap e trie. Também citados: tabela hash e árvore/busca binária.</p>
    <p><b>Mapa de Karnaugh (2 questões).</b></p>
    <p><b>Python (2–3, bem teóricas):</b> ler um código simples; arquivo com <code>write</code>, <code>seek</code> e <code>count</code>, incluindo uma pergunta no estilo “o que é, o que é”.</p>
    <p><b>Matemática:</b> derivada e gradiente descendente (achar o mínimo).</p>
    <p><b>Resto:</b> energia, sustentabilidade e IA. Quem já fez disse que dá para responder lendo com atenção.</p>
  </div>
  <p class="lead">Estude primeiro as matérias de prioridade <span class="pill p3">alta</span>: leia o resumo, treine as questões da matéria e feche com um simulado. Marque cada matéria quando se sentir seguro.</p>
  <div class="plan">${order.map(m=>`
    <div class="plan-item ${done[m.id]?"done":""}">
      <input type="checkbox" id="chk-${m.id}" data-id="${m.id}" ${done[m.id]?"checked":""} aria-label="Marcar ${esc(m.titulo)} como revisada">
      <div><h3>${esc(m.titulo)}</h3><div class="meta"><span class="pill p${m.prioridade}">${PRIO[m.prioridade]}</span> ${esc(m.grupo)} · ${cnt(m.id)} questões</div></div>
      <div class="row"><button class="btn" data-res="${m.id}">Resumo</button><button class="btn" data-tr="${m.id}">Treinar</button></div>
    </div>`).join("")}</div>`;
  $("#roteiro").querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{const d=store.get("done",{});d[c.dataset.id]=c.checked;store.set("done",d);c.closest(".plan-item").classList.toggle("done",c.checked)});
  $("#roteiro").querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>abrirMateria(b.dataset.res));
  $("#roteiro").querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>treinarMateria(b.dataset.tr));
}

// ---- matérias
function linkList(arr){return arr.length?`<ul>${arr.map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.texto)}</a></li>`).join("")}</ul>`:'<p class="small">Nenhum ainda.</p>'}
function renderMaterias(){
  const grupos=[...new Set(MAT.map(m=>m.grupo))];
  $("#materias").innerHTML=`<h2>Matérias</h2><p class="lead">Resumo de cada matéria com os capítulos da FIAP onde ela aparece e links para se aprofundar. As de prioridade alta já vêm abertas. Achou um erro ou quer melhorar um resumo? ${repoLink("/tree/main/materias","Edite o arquivo da matéria no GitHub")}.</p>`+
  grupos.map(g=>`<div class="group-label">${esc(g)}</div>`+MAT.filter(m=>m.grupo===g).map(m=>`
    <details class="topic" id="m-${m.id}" ${m.prioridade===3?"open":""}>
      <summary><h3>${esc(m.titulo)}</h3><span class="meta"><span class="pill p${m.prioridade}">${PRIO[m.prioridade]}</span> ${cnt(m.id)} questões</span></summary>
      <div class="topic-body">${md(m.md)}
        <div class="linkbox">
          <div><h4>No FIAP ON (precisa de login)</h4>${linkList(m.fiap)}</div>
          <div><h4>Para se aprofundar</h4>${linkList(m.links)}</div>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn primary" data-tr="${m.id}">Treinar esta matéria</button>${REPO?`<a class="btn" href="${esc(REPO)}/blob/main/materias/${m.id}.md" target="_blank" rel="noopener">Editar resumo</a>`:""}</div>
      </div>
    </details>`).join("")).join("");
  $("#materias").querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>treinarMateria(b.dataset.tr));
}

// ---- questão
function qHTML(q,idx,total){
  const m=MBY[q.materia];
  const meta=[`<span class="pill">${q.fonte==="oficial"?esc(q.origem||"Oficial"):"Comunidade"}</span>`];
  if(q.fase&&q.fonte!=="oficial")meta.push("Fase "+q.fase);
  if(m)meta.push(esc(m.titulo));
  if(q.autor)meta.push("por "+esc(q.autor));
  if(total)meta.push(`<span style="margin-left:auto">${idx+1}/${total}</span>`);
  return `<div class="qmeta">${meta.join(" · ")}</div>
    <div class="qtext">${esc(q.pergunta)}</div>${q.codigo?`<pre><code>${esc(q.codigo)}</code></pre>`:""}
    <div class="opts">${q.alternativas.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCDEF"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
}
const explHTML=(q,pick)=>`<div class="exp"><b class="${pick===q.resposta?"ok":"bad"}">${pick===q.resposta?"Correto.":"Incorreto."}</b> Resposta: <b>${"ABCDEF"[q.resposta]}</b>. ${esc(q.explicacao)}</div>`;

// ---- treino
const trainState={fonte:"",fase:"",materia:"",list:[],i:0,answered:{}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const filterQ=s=>Q.filter(q=>(!s.fonte||q.fonte===s.fonte)&&(!s.fase||String(q.fase)===s.fase)&&(!s.materia||q.materia===s.materia));
function startTrain(){trainState.list=shuffle(filterQ(trainState));trainState.i=0;trainState.answered={};renderTreino()}
function filtersHTML(s){
  const fases=[...new Set(Q.map(q=>q.fase).filter(Boolean))].sort();
  return `<div class="row">
    ${temOficiais?`<select id="tr-fonte" aria-label="Origem"><option value="">Todas as origens</option>${Object.entries(FONTES).map(([k,v])=>`<option value="${k}" ${s.fonte===k?"selected":""}>${v}</option>`).join("")}</select>`:""}
    ${fases.length?`<select id="tr-fase" aria-label="Fase"><option value="">Todas as fases</option>${fases.map(f=>`<option value="${f}" ${String(s.fase)===String(f)?"selected":""}>Fase ${f}</option>`).join("")}</select>`:""}
    <select id="tr-materia" aria-label="Matéria"><option value="">Todas as matérias</option>${MAT.map(m=>`<option value="${m.id}" ${s.materia===m.id?"selected":""}>${esc(m.titulo)} (${cnt(m.id)})</option>`).join("")}</select>
  </div>`;
}
function renderTreino(){
  const s=trainState,q=s.list[s.i];
  let h=`<h2>Treinar</h2><p class="lead">Uma questão por vez, com a correção logo depois de responder.</p>${filtersHTML(s)}`;
  if(!q){h+=`<div class="empty">Nenhuma questão com esses filtros ainda. ${repoLink("/blob/main/CONTRIBUTING.md","Que tal contribuir com uma?")}</div>`;$("#treino").innerHTML=h;bindFilters();return}
  h+=`<div class="progress"><i style="width:${(s.i/s.list.length*100).toFixed(1)}%"></i></div><div class="qcard" id="tr-card">${qHTML(q,s.i,s.list.length)}<div id="tr-exp"></div>
   <div class="qnav"><button class="btn" id="tr-prev" ${s.i?"":"disabled"}>Anterior</button><span class="row">${REPO&&q.fonte==="comunidade"?`<a class="btn" href="${esc(REPO)}/blob/main/${esc(q.id)}.json" target="_blank" rel="noopener">Corrigir</a>`:""}<button class="btn primary" id="tr-next">${s.i<s.list.length-1?"Próxima":"Recomeçar"}</button></span></div></div>`;
  $("#treino").innerHTML=h;bindFilters();
  const card=$("#tr-card");
  const paint=pick=>{card.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.resposta)b.classList.add("right");else if(i===pick)b.classList.add("wrong")});$("#tr-exp").innerHTML=explHTML(q,pick)};
  if(s.answered[q.id]!==undefined)paint(s.answered[q.id]);
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const pick=+b.dataset.i;s.answered[q.id]=pick;record(q,pick===q.resposta);paint(pick)});
  $("#tr-prev").onclick=()=>{s.i--;renderTreino()};
  $("#tr-next").onclick=()=>{if(s.i<s.list.length-1){s.i++;renderTreino()}else startTrain()};
}
function bindFilters(){["fonte","fase","materia"].forEach(k=>{const el=$("#tr-"+k);if(el)el.onchange=()=>{trainState[k]=el.value;startTrain()}})}

// ---- simulado
const sim={on:false,list:[],ans:{},i:0,done:false,n:20,fonte:""};
function buildSim(){
  const pool=Q.filter(q=>!sim.fonte||q.fonte===sim.fonte);
  const w=q=>{const p=(MBY[q.materia]||{prioridade:2}).prioridade;return Math.random()**(1/(p===3?3:p===2?1.6:1))};
  return pool.map(q=>[w(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,sim.n).map(x=>x[1]);
}
function renderSim(){
  const el=$("#simulado");
  if(!sim.on){
    el.innerHTML=`<h2>Simulado</h2><p class="lead">Questões sorteadas com mais peso para as matérias de prioridade alta. A correção só aparece no final.</p>
    <div class="row"><select id="sim-n" aria-label="Quantidade">${[10,20,30,40].map(n=>`<option ${n===sim.n?"selected":""} value="${n}">${n} questões</option>`).join("")}</select>
    ${temOficiais?`<select id="sim-fonte" aria-label="Origem"><option value="">Todas as origens</option>${Object.entries(FONTES).map(([k,v])=>`<option value="${k}" ${sim.fonte===k?"selected":""}>${v}</option>`).join("")}</select>`:""}
    <button class="btn primary" id="sim-go">Começar simulado</button></div>`;
    $("#sim-n").onchange=e=>sim.n=+e.target.value;const f=$("#sim-fonte");if(f)f.onchange=e=>sim.fonte=e.target.value;
    $("#sim-go").onclick=()=>{sim.list=buildSim();sim.ans={};sim.i=0;sim.done=false;sim.on=true;renderSim()};return;
  }
  if(sim.done){
    const ok=sim.list.filter(q=>sim.ans[q.id]===q.resposta).length;
    el.innerHTML=`<h2>Resultado</h2><div class="row" style="gap:20px"><div class="result">${ok}/${sim.list.length}</div><div class="lead">${Math.round(ok/sim.list.length*100)}% de acerto. Os erros foram para a aba Erros.</div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="sim-new">Novo simulado</button></div>
    <div class="revlist">${sim.list.map((q,i)=>{const p=sim.ans[q.id],good=p===q.resposta;return `<div class="revitem ${good?"ok":"bad"}"><div class="small">${i+1}. ${esc((MBY[q.materia]||{}).titulo)}</div><div class="qtext" style="font-size:15px">${esc(q.pergunta)}</div>${q.codigo?`<pre><code>${esc(q.codigo)}</code></pre>`:""}
      <div class="small">Sua resposta: <b>${p===undefined?"em branco":esc(q.alternativas[p])}</b></div><div class="small">Correta: <b>${esc(q.alternativas[q.resposta])}</b></div><div class="small" style="margin-top:4px">${esc(q.explicacao)}</div></div>`}).join("")}</div>`;
    $("#sim-new").onclick=()=>{sim.on=false;renderSim()};return;
  }
  const q=sim.list[sim.i],answered=Object.keys(sim.ans).length;
  el.innerHTML=`<h2>Simulado</h2><div class="small">${answered} de ${sim.list.length} respondidas</div><div class="progress"><i style="width:${answered/sim.list.length*100}%"></i></div>
  <div class="qcard">${qHTML(q,sim.i,sim.list.length)}
  <div class="qnav"><button class="btn" id="sim-prev" ${sim.i?"":"disabled"}>Anterior</button>
  <span class="row"><button class="btn" id="sim-end">Finalizar</button><button class="btn primary" id="sim-next" ${sim.i<sim.list.length-1?"":"disabled"}>Próxima</button></span></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.i===sim.ans[q.id])b.classList.add("sel");b.onclick=()=>{sim.ans[q.id]=+b.dataset.i;if(sim.i<sim.list.length-1)sim.i++;renderSim()}});
  $("#sim-prev").onclick=()=>{sim.i--;renderSim()};$("#sim-next").onclick=()=>{sim.i++;renderSim()};
  const end=$("#sim-end");end.onclick=()=>{
    const blank=sim.list.length-Object.keys(sim.ans).length;
    if(blank&&end.dataset.c!=="1"){end.dataset.c="1";end.textContent=`Finalizar com ${blank} em branco?`;return}
    sim.list.forEach(q=>record(q,sim.ans[q.id]===q.resposta));sim.done=true;renderSim()};
}

// ---- erros
function renderErros(){
  const wrong=Object.keys(hist).filter(id=>QBY[id]&&hist[id].last===false).map(id=>QBY[id]);
  $("#erros").innerHTML=`<h2>Caderno de erros</h2><p class="lead">Questões cuja última resposta foi errada. Ao acertar, ela sai daqui. Fica salvo só neste navegador.</p>`+
   (wrong.length?`<div class="row"><button class="btn primary" id="err-go">Refazer as ${wrong.length}</button></div>
   <div class="revlist">${wrong.map(q=>`<div class="revitem bad"><div class="small">${esc((MBY[q.materia]||{}).titulo)}</div><div style="font-weight:500">${esc(q.pergunta)}</div><div class="small">Correta: <b>${esc(q.alternativas[q.resposta])}</b></div></div>`).join("")}</div>`
   :`<div class="empty">Nenhum erro pendente. O que você errar no treino ou no simulado aparece aqui.</div>`);
  const go=$("#err-go");if(go)go.onclick=()=>{Object.assign(trainState,{list:shuffle(wrong),i:0,answered:{}});renderTreino();show("treino")};
}

$("#rodape").innerHTML=`Material colaborativo, feito por alunos para alunos. Não é um material oficial da FIAP. ${REPO?`${repoLink("","Código e conteúdo no GitHub")} · ${repoLink("/blob/main/CONTRIBUTING.md","Como contribuir")} · ${repoLink("/issues/new?template=nova-questao.yml","Sugerir questão sem usar git")} · `:""}Atualizado em ${esc(window.DADOS.gerado_em)}.`;
renderStats();renderRoteiro();renderMaterias();startTrain();renderSim();
const hash=location.hash.slice(1);
if(MBY[hash])abrirMateria(hash);else show(store.get("tab","roteiro"));
})();
</script>
