<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulados CC — Fases 1 a 6</title>
<meta name="description" content="Resumos, simulados e banco de questões colaborativo para estudar Ciência da Computação (fases 1 a 6).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
/* Layout: painel de missão — cabeçalho fixo com abas, coluna de leitura de ~72ch, cartões só onde há interação */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#151821; --muted:#5d6475; --line:#dde0e8;
  --accent:#2c50d6; --accent-soft:#e6ebfc; --hot:#c2410c; --hot-soft:#fdeee5;
  --ok:#137a43; --ok-soft:#e3f4ea; --bad:#b4232c; --bad-soft:#fbe6e7; --code:#eef0f5;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1117; --surface:#171a23; --fg:#e8eaf0; --muted:#9aa1b2; --line:#2a2f3c;
  --accent:#8aa2ff; --accent-soft:#1f2747; --hot:#fb923c; --hot-soft:#3a2216;
  --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1719; --code:#1e222d; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);margin:0}
a{color:var(--accent)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(22px,4vw,30px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:500 12px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stats{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--fg)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{font:600 14px var(--f-body);background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font:800 22px/1.2 var(--f-display);margin:28px 0 10px;text-wrap:balance}
h3{font:600 18px/1.3 var(--f-display);margin:0;text-wrap:balance}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:68ch}
code,pre{font-family:var(--f-mono);font-size:13px;background:var(--code);border-radius:4px}
code{padding:1px 5px}
pre{padding:12px 14px;overflow-x:auto;line-height:1.5;margin:8px 0 12px}
pre code{padding:0;background:none}
table{border-collapse:collapse;margin:8px 0 14px;font-size:14px;display:block;overflow-x:auto;max-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
ul{padding-left:20px;margin:0 0 10px}
blockquote{margin:10px 0;background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:14px}
blockquote p:last-child{margin:0}
.pill{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--code);color:var(--muted)}
.pill.p3{background:var(--hot-soft);color:var(--hot)}
.pill.p2{background:var(--accent-soft);color:var(--accent)}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
select{font:500 14px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.intel{border-left:3px solid var(--hot);padding:4px 0 4px 14px;margin:14px 0}
.intel p{margin:0 0 4px}
.plan{border-top:1px solid var(--line)}
.plan-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.plan-item input{width:18px;height:18px;accent-color:var(--accent)}
.meta{font:12px var(--f-mono);color:var(--muted)}
.plan-item.done h3{text-decoration:line-through;color:var(--muted)}
.group-label{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 4px}
details.topic{border-top:1px solid var(--line);padding:16px 0}
details.topic>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary h3::after{content:" +";color:var(--muted);font-weight:400}
details.topic[open]>summary h3::after{content:" −"}
.topic-body{max-width:72ch;margin-top:10px}
.linkbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0 4px}
.linkbox>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.linkbox h4{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.linkbox ul{margin:0;padding-left:18px;font-size:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:12px var(--f-mono);color:var(--muted);margin-bottom:10px}
.qtext{font-size:16px;font-weight:500;margin-bottom:12px;white-space:pre-wrap}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;font:15px/1.45 var(--f-body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0;white-space:pre-wrap}
.opt .k{font:600 13px var(--f-mono);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.exp{margin-top:12px;padding:12px;border-radius:8px;background:var(--code);font-size:14px}
.exp b.ok{color:var(--ok)} .exp b.bad{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent)}
.result{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;margin-top:14px}
.revlist{display:grid;gap:10px;margin-top:14px}
.revitem{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.revitem.bad{border-left:4px solid var(--bad)} .revitem.ok{border-left:4px solid var(--ok)}
.small{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px}
.filtros{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:4px}
.filtros>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.filtros>summary::-webkit-details-marker{display:none}
.filtros>summary .small{font-weight:400}
.fgrupo{margin-top:12px}
.fgrupo h5{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fgrupo h5 button{font:500 12px var(--f-body);text-transform:none;letter-spacing:0;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:99px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:disabled{opacity:.4;cursor:default}
.chip .c{font:12px var(--f-mono);opacity:.75;margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font:800 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .l{font:12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.grafico{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 6px}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico .grid{stroke:var(--line);stroke-width:1}
.grafico .eixo{fill:var(--muted);font:11px var(--f-mono)}
.grafico .linha{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.grafico .ponto{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.grafico .alvo{fill:transparent;cursor:pointer}
.grafico .alvo:hover+.ponto,.grafico .alvo:focus+.ponto{r:7}
.grafico .rot{fill:var(--fg);font:600 12px var(--f-mono)}
.barras{display:grid;gap:8px;margin-top:8px}
.barra{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:10px;align-items:center;font-size:14px}
.barra .trilho{height:10px;background:var(--code);border-radius:4px;overflow:hidden}
.barra .trilho i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.barra .num{font:12px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.hlist{display:grid;gap:0;border-top:1px solid var(--line);margin-top:8px}
.hitem{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hitem .pct{font:700 16px var(--f-mono);font-variant-numeric:tabular-nums}
@media (max-width:520px){.barra{grid-template-columns:minmax(0,1fr) 70px 60px}.hitem{grid-template-columns:1fr auto}.hitem .btn{grid-column:1/-1;justify-self:start}}
.guia{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.guia h5{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.trecho{background:var(--accent-soft);border-radius:6px;padding:8px 12px;margin:0 0 8px;max-width:72ch}
.trecho>*:last-child{margin-bottom:0}
.trecho table{margin:0}
.guia .row{gap:6px}
.guia .btn{font-size:13px;padding:5px 10px}
.revisar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px}
.revisar h3{margin-bottom:8px}
.revisar-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.revisar-item:first-of-type{border-top:0}
.revisar-item .n{font:800 20px var(--f-display);color:var(--bad);font-variant-numeric:tabular-nums}
.destaque{outline:3px solid var(--hot);outline-offset:3px;border-radius:4px;transition:outline-color 1.5s}
.passos{padding-left:22px;max-width:72ch;margin:0 0 12px}
.passos li{margin-bottom:6px}
.aviso{background:var(--code);border-radius:8px;padding:10px 14px;font-size:14px;max-width:72ch;margin:6px 0 4px}
.fz{display:inline-block;font:600 11px var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:3px}
.fz.tarde{background:var(--hot-soft);color:var(--hot)}
.matriz{border-collapse:collapse;font-size:14px;margin:10px 0 6px}
.matriz th,.matriz td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}
.matriz th:first-child,.matriz td:first-child{text-align:left;padding-left:0}
.matriz td.on{color:var(--accent);font:600 13px var(--f-mono);white-space:nowrap}
.matriz td.on.tarde{color:var(--hot)}
.matriz td.off{color:var(--line)}
.matriz button{background:none;border:0;padding:0;color:var(--fg);font:500 14px var(--f-body);cursor:pointer;text-align:left}
.matriz button:hover{color:var(--accent);text-decoration:underline}
.matriz .sep{border-left:2px solid var(--line)}
@media (max-width:520px){.qcard{padding:14px}.plan-item{grid-template-columns:auto 1fr}.plan-item .row{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar">
    <h1>Simulados CC<small>Ciência da Computação · Fases 1 a 6</small></h1>
    <div class="stats" id="stats"></div>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="roteiro">Roteiro</button>
    <button role="tab" data-tab="materias">Matérias</button>
    <button role="tab" data-tab="treino">Treinar</button>
    <button role="tab" data-tab="simulado">Simulado</button>
    <button role="tab" data-tab="erros">Erros</button>
    <button role="tab" data-tab="historico">Histórico</button>
  </nav>
</div></header>

<main class="wrap">
  <section id="roteiro" role="tabpanel"></section>
  <section id="materias" role="tabpanel" hidden></section>
  <section id="treino" role="tabpanel" hidden></section>
  <section id="simulado" role="tabpanel" hidden></section>
  <section id="erros" role="tabpanel" hidden></section>
  <section id="historico" role="tabpanel" hidden></section>
  <footer class="small" id="rodape"></footer>
</main>

<script src="dados.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!window.DADOS){document.querySelector("main").innerHTML='<div class="empty">Não encontrei <code>site/dados.js</code>. Rode <code>python3 scripts/build.py</code> na raiz do repositório e recarregue a página.</div>';return}
const store={get(k,d){try{const v=localStorage.getItem("simuladoscc:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("simuladoscc:"+k,JSON.stringify(v))}catch(e){}}};
const md=s=>window.marked?marked.parse(s):"<pre>"+esc(s)+"</pre>";
const {materias:MAT,repo:REPO}=window.DADOS;
const MBY=Object.fromEntries(MAT.map(m=>[m.id,m]));
// ---- banco pessoal importado: fica só no navegador de quem importou
function normalizarBanco(lista){
  const ok=[],ignoradas=[];
  if(!Array.isArray(lista))return {ok,ignoradas:["o arquivo precisa ser uma lista [ {...}, {...} ]"]};
  lista.forEach((q,i)=>{
    const n=`#${i+1}`;
    if(!q||typeof q!=="object"){ignoradas.push(n+": não é um objeto");return}
    if(!MBY[q.materia]){ignoradas.push(`${n}: matéria desconhecida (${q.materia??"vazia"})`);return}
    if(typeof q.pergunta!=="string"||!q.pergunta.trim()){ignoradas.push(n+": sem pergunta");return}
    const alts=q.alternativas;
    if(!Array.isArray(alts)||alts.length<2||alts.length>6||!alts.every(a=>typeof a==="string"&&a.trim())){ignoradas.push(n+": alternativas inválidas");return}
    const r=typeof q.resposta==="number"?q.resposta:"ABCDEF".indexOf(String(q.resposta??"").trim().toUpperCase());
    if(!(r>=0&&r<alts.length)){ignoradas.push(n+": resposta inválida");return}
    const fase=Number.isInteger(q.fase)?q.fase:null;
    ok.push({id:"pessoal:"+(q.id||norm(q.pergunta).slice(0,80)+"|"+alts.length),materia:q.materia,pergunta:q.pergunta.trim(),codigo:typeof q.codigo==="string"?q.codigo:"",
      alternativas:alts.map(a=>a.trim()),resposta:r,explicacao:typeof q.explicacao==="string"?q.explicacao.trim():"",fase,autor:q.autor||"",fonte:"pessoal",origem:q.origem||"Importada",fases:fase?[fase]:MBY[q.materia].fases});
  });
  return {ok,ignoradas};
}
const BANCO=store.get("banco",[]);
const Q=(()=>{const vistos=new Set(),out=[];for(const q of [...window.DADOS.questoes,...BANCO]){if(vistos.has(q.id))continue;vistos.add(q.id);out.push(q)}return out})();
const QBY=Object.fromEntries(Q.map(q=>[q.id,q]));
const PRIO={3:"alta",2:"média",1:"baixa"};
const temPessoais=Q.some(q=>q.fonte==="pessoal");
const FONTES={comunidade:"Comunidade",pessoal:"Pessoal (local)"};
const repoLink=(p,txt)=>REPO?`<a href="${esc(REPO)}${p}" target="_blank" rel="noopener">${txt}</a>`:txt;

let hist=store.get("hist",{});
function record(q,ok){const h=hist[q.id]||{n:0,ok:0};h.n++;if(ok)h.ok++;h.last=ok;hist[q.id]=h;store.set("hist",hist);renderStats()}
function renderStats(){
  const ids=Object.keys(hist).filter(id=>QBY[id]);
  const tot=ids.reduce((s,id)=>s+hist[id].n,0),ok=ids.reduce((s,id)=>s+hist[id].ok,0);
  const pend=ids.filter(id=>hist[id].last===false).length;
  $("#stats").innerHTML=`<span><b>${Q.length}</b> questões</span><span><b>${ids.length}</b> vistas</span><span><b>${tot?Math.round(ok/tot*100):0}%</b> acerto</span><span><b>${pend}</b> a revisar</span>`;
}

const tabs=[...document.querySelectorAll("#tabs button")];
function show(t){tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));document.querySelectorAll("main>section").forEach(s=>s.hidden=s.id!==t);store.set("tab",t);if(t==="erros")renderErros();if(t==="historico"){histView=null;renderHistorico()}}
tabs.forEach(b=>b.onclick=()=>{show(b.dataset.tab);window.scrollTo(0,0)});
const cnt=id=>Q.filter(q=>q.materia===id).length;
const RECORTES={"":"Todas as fases","1-4":"Fases 1 a 4","5-6":"Fases 5 e 6","1":"Fase 1","2":"Fase 2","3":"Fase 3","4":"Fase 4","5":"Fase 5","6":"Fase 6"};
const fasesDoRecorte=r=>{if(!r)return null;if(r.includes("-")){const[a,b]=r.split("-").map(Number);return [1,2,3,4,5,6,7].filter(f=>f>=a&&f<=b)}return r.split(",").map(Number)};
const noRecorte=(fases,r)=>{const fs=fasesDoRecorte(r);return !fs||(fases||[]).some(f=>fs.includes(f))};
const recorteDe=fs=>{fs=[...new Set(fs)].sort();const k=fs.join(",");return !fs.length||k==="1,2,3,4,5,6"?"":k==="1,2,3,4"?"1-4":k==="5,6"?"5-6":k};
const chips=fases=>(fases||[]).map(f=>`<span class="fz ${f>=5?"tarde":""}" title="Fase ${f}">F${f}</span>`).join("");
function recorteSelect(id,val){const ops=Object.assign({},RECORTES);if(val&&!ops[val])ops[val]="Fases "+val.replace(/,/g,", ");return `<select id="${id}" aria-label="Fases">${Object.entries(ops).map(([k,v])=>`<option value="${k}" ${val===k?"selected":""}>${v}</option>`).join("")}</select>`}
function abrirMateria(id,bloco){show("materias");const el=document.getElementById("m-"+id);if(!el)return;el.open=true;
  const alvo=bloco!=null&&BLOCOS[id]?BLOCOS[id][bloco]:null;
  if(alvo){alvo.scrollIntoView({block:"center"});alvo.classList.add("destaque");setTimeout(()=>alvo.classList.remove("destaque"),2500)}else el.scrollIntoView()}

// ---- guia de revisão: acha o trecho do resumo que responde a questão
const PARE=new Set("a o e é de da do das dos em no na nos nas um uma uns umas para por com sem que qual quais quando como mais menos ser são está estão pode podem ou se seu sua seus suas ao aos à às pelo pela entre sobre sempre cada isso este esta esse essa ela ele elas eles tem ter the of".split(" "));
const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const tokens=t=>{const n=norm(t);const extra=[...n.matchAll(/[σΣ]m\s*\(([\d,\s]+)\)/gi)].map(x=>"m:"+x[1].replace(/\s/g,""));
  return n.split(/[^a-z0-9²³ⁿ∇]+/).filter(w=>w.length>=3&&!PARE.has(w)).map(w=>w.slice(0,5)).concat(extra)};
let BLOCOS={},BLOCOS_TOK={};
function indexarBlocos(){
  BLOCOS={};BLOCOS_TOK={};
  MAT.forEach(m=>{const body=document.querySelector("#m-"+m.id+" .topic-body .md");if(!body)return;
    const els=[...body.querySelectorAll("li, p, tr, pre, blockquote")].filter(e=>!e.closest("li li")&&!(e.tagName==="P"&&e.closest("li, blockquote"))&&e.textContent.trim().length>15&&!e.querySelector("th"));
    BLOCOS[m.id]=els;BLOCOS_TOK[m.id]=els.map(e=>new Set(tokens(e.textContent)));});
}
function melhorTrecho(q){
  const toks=BLOCOS_TOK[q.materia];if(!toks||!toks.length)return null;
  const peso={};const add=(t,w)=>tokens(t).forEach(x=>peso[x]=Math.max(peso[x]||0,x.startsWith("m:")?6:w));
  add(q.pergunta,1);add(q.explicacao,1.5);add(q.alternativas[q.resposta],2);if(q.codigo)add(q.codigo,.5);
  const df=x=>toks.filter(s=>s.has(x)).length;
  let best=-1,bi=-1;toks.forEach((s,i)=>{let sc=0;for(const x in peso)if(s.has(x))sc+=peso[x]*Math.log(1+toks.length/df(x));if(sc>best){best=sc;bi=i}});
  return best>=2?bi:null;
}
function capitulosDa(q){const m=MBY[q.materia];if(!m)return[];const fs=q.fases||[];const caps=m.fiap.filter(l=>fs.some(f=>l.texto.includes("Fase "+f+" ")));return caps.length?caps:m.fiap}
function guiaHTML(q){
  const m=MBY[q.materia];if(!m)return"";
  const bi=melhorTrecho(q);const el=bi!=null?BLOCOS[q.materia][bi]:null;
  let trecho="";
  if(el){const inner=el.tagName==="TR"?[...el.children].map(c=>c.innerHTML).join(" — "):el.tagName==="PRE"?el.outerHTML:el.innerHTML;trecho=`<div class="trecho">${inner}</div>`}
  const caps=capitulosDa(q).slice(0,2),ext=m.links[0];
  return `<div class="guia"><h5>Para revisar</h5>${trecho?`<div class="small">No resumo de ${esc(m.titulo)}:</div>${trecho}`:""}
    <div class="row"><button class="btn" data-ir="${m.id}" data-bloco="${bi??""}">${el?"Ver no resumo":"Abrir resumo de "+esc(m.titulo)}</button>${caps.map(c=>`<a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">FIAP ON: ${esc(c.texto.split(" — ")[0])}</a>`).join("")}${ext?`<a class="btn" href="${esc(ext.url)}" target="_blank" rel="noopener">${esc(ext.texto.split(" — ")[0])}</a>`:""}</div></div>`;
}
function revisarHTML(erradas){
  if(!erradas.length)return"";
  const por={};erradas.forEach(q=>{(por[q.materia]=por[q.materia]||[]).push(q)});
  const lista=Object.entries(por).sort((a,b)=>b[1].length-a[1].length||(MBY[b[0]]||{}).prioridade-(MBY[a[0]]||{}).prioridade);
  return `<div class="revisar"><h3>O que revisar</h3><p class="small">Matérias em que você errou, da que mais errou para a que menos errou.</p>${lista.map(([mid,qs])=>{const m=MBY[mid]||{titulo:mid,fiap:[],fases:[]};const caps=[...new Map(qs.flatMap(capitulosDa).map(c=>[c.url,c])).values()].slice(0,3);
    return `<div class="revisar-item"><span class="n">${qs.length}</span><div><b>${esc(m.titulo)}</b> ${chips(m.fases)}<div class="row" style="margin-top:6px"><button class="btn" data-ir="${mid}" data-bloco="">Ler resumo</button><button class="btn" data-trm="${mid}">Treinar a matéria</button>${caps.map(c=>`<a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">FIAP ON: ${esc(c.texto.split(" — ")[0])}</a>`).join("")}</div></div></div>`}).join("")}</div>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ir],[data-trm]");if(!b)return;
  if(b.dataset.trm){treinarMateria(b.dataset.trm);return}
  abrirMateria(b.dataset.ir,b.dataset.bloco===""?null:+b.dataset.bloco)});

  return `<div class="qmeta">${meta.join(" · ")}</div>

}
const explHTML=(q,pick)=>`<div class="exp"><b class="${pick===q.resposta?"ok":"bad"}">${pick===q.resposta?"Correto.":"Incorreto."}</b> Resposta: <b>${"ABCDEF"[q.resposta]}</b>. ${esc(q.explicacao)}</div>`;

// ---- treino
const trainState={fonte:"",recorte:store.get("recorte",""),materias:store.get("materias",[]).filter(id=>MBY[id]),list:[],i:0,answered:{}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const filterQ=s=>Q.filter(q=>(!s.fonte||q.fonte===s.fonte)&&noRecorte(q.fases,s.recorte)&&(!s.materias.length||s.materias.includes(q.materia)));
function startTrain(){trainState.list=shuffle(filterQ(trainState));trainState.i=0;trainState.answered={};renderTreino()}
function filtersHTML(s){
  const fsel=fasesDoRecorte(s.recorte)||[];
  const sel=new Set(s.materias);

  const resumo=`${s.materias.length?s.materias.length+(s.materias.length>1?" matérias":" matéria"):"Todas as matérias"} · ${s.recorte?(RECORTES[s.recorte]||"Fases "+s.recorte.replace(/,/g,", ")):"todas as fases"}`;

    <summary><span>Filtros</span><span class="small">${esc(resumo)} · <b>${n}</b> questões</span></summary>
    ${temPessoais?`<div class="fgrupo"><h5>Origem</h5><select id="tr-fonte" aria-label="Origem"><option value="">Todas as origens</option>${Object.entries(FONTES).map(([k,v])=>`<option value="${k}" ${s.fonte===k?"selected":""}>${v}</option>`).join("")}</select></div>`:""}
    <div class="fgrupo"><h5>Fases <button data-fpre="">Todas</button><button data-fpre="1-4">1 a 4</button><button data-fpre="5-6">5 e 6</button></h5>
      <div class="chips">${[1,2,3,4,5,6].map(f=>`<button class="chip" data-fase="${f}" aria-pressed="${fsel.includes(f)}">Fase ${f}</button>`).join("")}</div></div>
    <div class="fgrupo"><h5>Matérias <button data-mpre="">Todas</button><button data-mpre="alta">Prioridade alta</button></h5>
      <div class="chips">${MAT.map(m=>{const ok=noRecorte(m.fases,s.recorte);const c=Q.filter(q=>q.materia===m.id&&(!s.fonte||q.fonte===s.fonte)&&noRecorte(q.fases,s.recorte)).length;
        return `<button class="chip" data-mat="${m.id}" aria-pressed="${sel.has(m.id)}" ${ok?"":"disabled"} title="${esc(m.grupo)} · fases ${m.fases.join(", ")}">${esc(m.titulo.split(" (")[0])}<span class="c">${c}</span></button>`}).join("")}</div></div>
  </details>`;
}
function renderTreino(){
  const s=trainState,q=s.list[s.i];
  let h=`<h2>Treinar</h2><p class="lead">Uma questão por vez, com a correção logo depois de responder.</p>${filtersHTML(s)}`;
  if(!q){h+=`<div class="empty">Nenhuma questão com esses filtros ainda. ${repoLink("/blob/main/CONTRIBUTING.md","Que tal contribuir com uma?")}</div>`;$("#treino").innerHTML=h;bindFilters();return}
  h+=`<div class="progress"><i style="width:${(s.i/s.list.length*100).toFixed(1)}%"></i></div><div class="qcard" id="tr-card">${qHTML(q,s.i,s.list.length)}<div id="tr-exp"></div>
   <div class="qnav"><button class="btn" id="tr-prev" ${s.i?"":"disabled"}>Anterior</button><span class="row">${REPO&&q.fonte==="comunidade"?`<a class="btn" href="${esc(REPO)}/blob/main/${esc(q.id)}.json" target="_blank" rel="noopener">Corrigir</a>`:""}<button class="btn primary" id="tr-next">${s.i<s.list.length-1?"Próxima":"Recomeçar"}</button></span></div></div>`;
  $("#treino").innerHTML=h;bindFilters();
  const card=$("#tr-card");
  const paint=pick=>{card.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.resposta)b.classList.add("right");else if(i===pick)b.classList.add("wrong")});$("#tr-exp").innerHTML=explHTML(q,pick)+(pick!==q.resposta?guiaHTML(q):"")};
  if(s.answered[q.id]!==undefined)paint(s.answered[q.id]);
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const pick=+b.dataset.i;s.answered[q.id]=pick;record(q,pick===q.resposta);paint(pick)});
  $("#tr-prev").onclick=()=>{s.i--;renderTreino()};
  $("#tr-next").onclick=()=>{if(s.i<s.list.length-1){s.i++;renderTreino()}else startTrain()};
}
function bindFilters(){
  const aplicar=()=>{store.set("materias",trainState.materias);store.set("recorte",trainState.recorte);sim.recorte=trainState.recorte;if(!sim.on)renderSim();startTrain()};
  const limparFora=()=>{trainState.materias=trainState.materias.filter(id=>noRecorte((MBY[id]||{}).fases,trainState.recorte))};
  const det=$("#tr-filtros");if(det)det.ontoggle=()=>store.set("filtrosAbertos",det.open);
  const fonte=$("#tr-fonte");if(fonte)fonte.onchange=()=>{trainState.fonte=fonte.value;startTrain()};
  document.querySelectorAll("#treino [data-fase]").forEach(b=>b.onclick=()=>{const fs=new Set(fasesDoRecorte(trainState.recorte)||[]);const f=+b.dataset.fase;fs.has(f)?fs.delete(f):fs.add(f);trainState.recorte=recorteDe([...fs]);limparFora();aplicar()});
  document.querySelectorAll("#treino [data-fpre]").forEach(b=>b.onclick=()=>{trainState.recorte=b.dataset.fpre;limparFora();aplicar()});
  document.querySelectorAll("#treino [data-mat]").forEach(b=>b.onclick=()=>{const id=b.dataset.mat,m=trainState.materias;trainState.materias=m.includes(id)?m.filter(x=>x!==id):[...m,id];aplicar()});
  document.querySelectorAll("#treino [data-mpre]").forEach(b=>b.onclick=()=>{trainState.materias=b.dataset.mpre==="alta"?MAT.filter(m=>m.prioridade===3&&noRecorte(m.fases,trainState.recorte)).map(m=>m.id):[];aplicar()});
}

// ---- simulado
const sim={on:false,list:[],ans:{},i:0,done:false,n:20,fonte:"",recorte:store.get("recorte","")};
function buildSim(){
  const pool=Q.filter(q=>(!sim.fonte||q.fonte===sim.fonte)&&noRecorte(q.fases,sim.recorte));
  const w=q=>{const p=(MBY[q.materia]||{prioridade:2}).prioridade;return Math.random()**(1/(p===3?3:p===2?1.6:1))};
  return pool.map(q=>[w(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,sim.n).map(x=>x[1]);
}
function renderSim(){
  const el=$("#simulado");
  if(!sim.on){
    el.innerHTML=`<h2>Simulado</h2><p class="lead">Questões sorteadas com mais peso para as matérias de prioridade alta. A correção só aparece no final. Escolha o recorte de fases que quer treinar.</p>
    <div class="row">${recorteSelect("sim-recorte",sim.recorte)}<select id="sim-n" aria-label="Quantidade">${[10,20,30,40].map(n=>`<option ${n===sim.n?"selected":""} value="${n}">${n} questões</option>`).join("")}</select>
    ${temPessoais?`<select id="sim-fonte" aria-label="Origem"><option value="">Todas as origens</option>${Object.entries(FONTES).map(([k,v])=>`<option value="${k}" ${sim.fonte===k?"selected":""}>${v}</option>`).join("")}</select>`:""}
    <button class="btn primary" id="sim-go">Começar simulado</button></div>`;
    $("#sim-n").onchange=e=>sim.n=+e.target.value;$("#sim-recorte").onchange=e=>{sim.recorte=e.target.value;store.set("recorte",sim.recorte);trainState.recorte=sim.recorte;trainState.materias=trainState.materias.filter(id=>noRecorte((MBY[id]||{}).fases,sim.recorte));startTrain()};const f=$("#sim-fonte");if(f)f.onchange=e=>sim.fonte=e.target.value;
    $("#sim-go").onclick=()=>{sim.list=buildSim();if(!sim.list.length)return;sim.ans={};sim.i=0;sim.done=false;sim.on=true;renderSim()};return;
  }
  if(sim.done){
    el.innerHTML=`<h2>Resultado</h2>${resultadoHTML(sim.list,sim.ans,`<button class="btn primary" id="sim-new">Novo simulado</button><button class="btn" data-irhist="1">Ver histórico</button>`)}`;
    $("#sim-new").onclick=()=>{sim.on=false;renderSim()};return;
  }
  const q=sim.list[sim.i],answered=Object.keys(sim.ans).length;
  el.innerHTML=`<h2>Simulado</h2><div class="small">${answered} de ${sim.list.length} respondidas</div><div class="progress"><i style="width:${answered/sim.list.length*100}%"></i></div>
  <div class="qcard">${qHTML(q,sim.i,sim.list.length)}
  <div class="qnav"><button class="btn" id="sim-prev" ${sim.i?"":"disabled"}>Anterior</button>
  <span class="row"><button class="btn" id="sim-end">Finalizar</button><button class="btn primary" id="sim-next" ${sim.i<sim.list.length-1?"":"disabled"}>Próxima</button></span></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.i===sim.ans[q.id])b.classList.add("sel");b.onclick=()=>{sim.ans[q.id]=+b.dataset.i;if(sim.i<sim.list.length-1)sim.i++;renderSim()}});
  $("#sim-prev").onclick=()=>{sim.i--;renderSim()};$("#sim-next").onclick=()=>{sim.i++;renderSim()};
  const end=$("#sim-end");end.onclick=()=>{
    const blank=sim.list.length-Object.keys(sim.ans).length;
    if(blank&&end.dataset.c!=="1"){end.dataset.c="1";end.textContent=`Finalizar com ${blank} em branco?`;return}
    sim.list.forEach(q=>record(q,sim.ans[q.id]===q.resposta));salvarSimulado();sim.done=true;renderSim()};
}

// ---- resultado e histórico de simulados
function resultadoHTML(list,ans,botoes){
  const ok=list.filter(q=>ans[q.id]===q.resposta).length;
  return `<div class="row" style="gap:20px"><div class="result">${ok}/${list.length}</div><div class="lead">${list.length?Math.round(ok/list.length*100):0}% de acerto.</div></div>
    <div class="row" style="margin-top:12px">${botoes||""}</div>
    ${revisarHTML(list.filter(q=>ans[q.id]!==q.resposta))}
    <h3 style="margin-top:22px">Questão por questão</h3>
    <div class="revlist">${list.map((q,i)=>{const p=ans[q.id],good=p===q.resposta;return `<div class="revitem ${good?"ok":"bad"}"><div class="small">${i+1}. ${esc((MBY[q.materia]||{}).titulo)}</div><div class="qtext" style="font-size:15px">${esc(q.pergunta)}</div>${q.codigo?`<pre><code>${esc(q.codigo)}</code></pre>`:""}
      <div class="small">Sua resposta: <b>${p===undefined?"em branco":esc(q.alternativas[p])}</b></div><div class="small">Correta: <b>${esc(q.alternativas[q.resposta])}</b></div><div class="small" style="margin-top:4px">${esc(q.explicacao)}</div>${good?"":guiaHTML(q)}</div>`}).join("")}</div>`;
}
function salvarSimulado(){
  const ok=sim.list.filter(q=>sim.ans[q.id]===q.resposta).length;
  const h=store.get("simulados",[]);
  h.push({t:Date.now(),n:sim.list.length,ok,recorte:sim.recorte||"",fonte:sim.fonte||"",itens:sim.list.map(q=>[q.id,sim.ans[q.id]??null])});
  store.set("simulados",h.slice(-100));
}
let histView=null;
const dataBR=t=>new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const pct=(a,b)=>b?Math.round(a/b*100):0;
const recorteTxt=r=>r?(RECORTES[r]||"Fases "+r.replace(/,/g,", ")):"Todas as fases";
function graficoEvolucao(h){
  if(h.length<2)return `<p class="small">O gráfico de evolução aparece a partir do segundo simulado.</p>`;
  const W=600,H=180,L=34,R=40,T=14,B=26,n=h.length;
  const x=i=>L+(n===1?0:(W-L-R)*i/(n-1)),y=v=>T+(H-T-B)*(1-v/100);
  const pts=h.map((s,i)=>[x(i),y(pct(s.ok,s.n)),s,i]);
  const grid=[0,50,100].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="eixo" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join("");
  const ult=pts[n-1];
  const marcas=pts.map(([px,py,s,i])=>`<g><circle class="alvo" cx="${px}" cy="${py}" r="12" tabindex="0" data-hver="${s.t}"><title>${dataBR(s.t)}: ${s.ok}/${s.n} (${pct(s.ok,s.n)}%) · ${recorteTxt(s.recorte)}</title></circle><circle class="ponto" cx="${px}" cy="${py}" r="5"/></g>`).join("");
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Acerto por simulado, do mais antigo ao mais recente">${grid}
    <text class="eixo" x="${L}" y="${H-6}">1º</text><text class="eixo" x="${W-R}" y="${H-6}" text-anchor="end">${n}º simulado</text>
    <polyline class="linha" points="${pts.map(p=>p[0]+","+p[1]).join(" ")}"/>${marcas}
    <text class="rot" x="${ult[0]+10}" y="${ult[1]+4}">${pct(ult[2].ok,ult[2].n)}%</text></svg></div>`;
}
function renderHistorico(){
  const el=$("#historico");const h=store.get("simulados",[]);
  if(histView){
    const s=h.find(x=>x.t===histView);
    if(s){const list=s.itens.map(([id])=>QBY[id]).filter(Boolean);const ans=Object.fromEntries(s.itens.map(([id,p])=>[id,p===null?undefined:p]));const faltam=s.itens.length-list.length;
      el.innerHTML=`<div class="row" style="margin-top:20px"><button class="btn" id="hist-voltar">← Voltar ao histórico</button></div>
        <h2>Simulado de ${esc(dataBR(s.t))}</h2><p class="small">${esc(recorteTxt(s.recorte))}${s.fonte?" · "+esc(FONTES[s.fonte]||s.fonte):""} · nota na hora: ${s.ok}/${s.n}${faltam?` · ${faltam} questão(ões) não estão mais no banco e foram omitidas`:""}</p>
        ${resultadoHTML(list,ans,"")}`;
      $("#hist-voltar").onclick=()=>{histView=null;renderHistorico();window.scrollTo(0,0)};return}
    histView=null;
  }
  if(!h.length){el.innerHTML=`<h2>Histórico de simulados</h2><div class="empty">Você ainda não terminou nenhum simulado. Ao finalizar um, ele aparece aqui com a nota, a evolução e a correção completa.<div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" data-irsim="1">Fazer um simulado</button></div></div>`;return}
  const tot=h.reduce((a,s)=>a+s.n,0),acc=h.reduce((a,s)=>a+s.ok,0);
  const melhor=h.reduce((b,s)=>pct(s.ok,s.n)>pct(b.ok,b.n)?s:b,h[0]),ult=h[h.length-1];
  const porM={};h.forEach(s=>s.itens.forEach(([id,p])=>{const q=QBY[id];if(!q)return;const m=porM[q.materia]=porM[q.materia]||{ok:0,n:0};m.n++;if(p===q.resposta)m.ok++}));
  const mats=Object.entries(porM).sort((a,b)=>pct(a[1].ok,a[1].n)-pct(b[1].ok,b[1].n)||b[1].n-a[1].n);
  el.innerHTML=`<h2>Histórico de simulados</h2><p class="lead">Seus simulados finalizados, salvos só neste navegador.</p>
    <div class="tiles">
      <div class="tile"><div class="v">${h.length}</div><div class="l">simulados</div></div>
      <div class="tile"><div class="v">${pct(acc,tot)}%</div><div class="l">acerto médio</div></div>
      <div class="tile"><div class="v">${pct(melhor.ok,melhor.n)}%</div><div class="l">melhor</div></div>
      <div class="tile"><div class="v">${pct(ult.ok,ult.n)}%</div><div class="l">último</div></div>
    </div>
    <h3>Evolução</h3>${graficoEvolucao(h)}
    <h3 style="margin-top:22px">Acerto por matéria</h3><p class="small">Somando todos os simulados, da matéria com menor acerto para a maior.</p>
    <div class="barras">${mats.map(([mid,m])=>`<div class="barra"><button class="btn" style="text-align:left;border:0;padding:0;background:none;color:var(--fg);font:500 14px var(--f-body)" data-ir="${mid}" data-bloco="">${esc((MBY[mid]||{titulo:mid}).titulo)}</button><div class="trilho" role="img" aria-label="${pct(m.ok,m.n)}%"><i style="width:${pct(m.ok,m.n)}%"></i></div><span class="num">${m.ok}/${m.n} · ${pct(m.ok,m.n)}%</span></div>`).join("")}</div>
    <h3 style="margin-top:22px">Simulados feitos</h3>
    <div class="hlist">${h.slice().reverse().map(s=>`<div class="hitem"><div><b>${esc(dataBR(s.t))}</b><div class="small">${s.n} questões · ${esc(recorteTxt(s.recorte))}${s.fonte?" · "+esc(FONTES[s.fonte]||s.fonte):""}</div></div><span class="pct">${s.ok}/${s.n} · ${pct(s.ok,s.n)}%</span><button class="btn" data-hver="${s.t}">Ver correção</button></div>`).join("")}</div>
    <div class="row" style="margin-top:18px"><button class="btn" id="hist-apagar">Apagar histórico</button></div>`;
  const ap=$("#hist-apagar");ap.onclick=()=>{if(ap.dataset.c!=="1"){ap.dataset.c="1";ap.textContent=`Apagar os ${h.length} simulados? Clique de novo`;return}store.set("simulados",[]);renderHistorico()};
}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-hver]");if(v){histView=+v.dataset.hver;show("historico");histView=+v.dataset.hver;renderHistorico();window.scrollTo(0,0);return}
  if(e.target.closest("[data-irhist]")){show("historico");window.scrollTo(0,0);return}
  if(e.target.closest("[data-irsim]")){show("simulado");window.scrollTo(0,0)}
});
document.addEventListener("keydown",e=>{const v=e.target.closest&&e.target.closest("circle[data-hver]");if(v&&(e.key==="Enter"||e.key===" ")){e.preventDefault();v.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});

// ---- erros
function renderErros(){
  const wrong=Object.keys(hist).filter(id=>QBY[id]&&hist[id].last===false).map(id=>QBY[id]);
  $("#erros").innerHTML=`<h2>Caderno de erros</h2><p class="lead">Questões cuja última resposta foi errada. Ao acertar, ela sai daqui. Fica salvo só neste navegador.</p>`+
   (wrong.length?`<div class="row"><button class="btn primary" id="err-go">Refazer as ${wrong.length}</button></div>
   ${revisarHTML(wrong)}
   <div class="revlist">${wrong.map(q=>`<div class="revitem bad"><div class="small">${esc((MBY[q.materia]||{}).titulo)}</div><div style="font-weight:500">${esc(q.pergunta)}</div><div class="small">Correta: <b>${esc(q.alternativas[q.resposta])}</b></div>${guiaHTML(q)}</div>`).join("")}</div>`
   :`<div class="empty">Nenhum erro pendente. O que você errar no treino ou no simulado aparece aqui.</div>`);
  const go=$("#err-go");if(go)go.onclick=()=>{Object.assign(trainState,{list:shuffle(wrong),i:0,answered:{}});renderTreino();show("treino")};
}

$("#rodape").innerHTML=`Material colaborativo, feito por alunos para alunos. Não é um material oficial da FIAP. As questões são adicionadas depois que cada fase termina. ${REPO?`${repoLink("","Código e conteúdo no GitHub")} · ${repoLink("/blob/main/CONTRIBUTING.md","Como contribuir")} · ${repoLink("/issues/new?template=nova-questao.yml","Sugerir questão sem usar git")} · `:""}Atualizado em ${esc(window.DADOS.gerado_em)}.`;
renderStats();renderRoteiro();renderMaterias();startTrain();renderSim();
const hash=location.hash.slice(1);
if(MBY[hash])abrirMateria(hash);else show(store.get("tab","roteiro"));
})();
</script>
</body>
